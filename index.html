<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTM Hero</title>
  <style>
    :root {
      --accent: #00ff66;
      --bg: #000;
      --ink: #f4f4f4;
      --muted: #a8a8a8;
      --danger: #ff3b3b;
      --gold: #ffd84d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--ink);
      font-family: "Courier New", ui-monospace, monospace;
      overflow-x: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.06) 0,
        rgba(255,255,255,0.06) 1px,
        transparent 2px,
        transparent 5px
      );
      opacity: 0.16;
    }

    .arcade {
      width: min(100%, 920px);
      display: grid;
      gap: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(24px, 5vw, 48px);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--gold);
      font-size: 13px;
      text-align: right;
    }

    .hud span {
      border: 1px solid var(--gold);
      padding: 6px 8px;
      background: #000;
    }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 340px;
      max-height: calc(100vh - 160px);
      border: 2px solid var(--accent);
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #000;
      text-align: center;
      transition: opacity 240ms steps(3, end);
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .prompt h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: clamp(28px, 7vw, 62px);
      line-height: 1;
    }

    .prompt p {
      margin: 0 0 18px;
      color: var(--ink);
      font-size: clamp(16px, 3vw, 24px);
      line-height: 1.35;
    }

    button,
    .cta {
      appearance: none;
      border: 2px solid var(--accent);
      background: #000;
      color: var(--accent);
      cursor: pointer;
      display: inline-block;
      font: inherit;
      font-size: 16px;
      line-height: 1.2;
      padding: 10px 14px;
      text-decoration: none;
      text-transform: uppercase;
    }

    button:hover,
    button:focus-visible,
    .cta:hover,
    .cta:focus-visible {
      background: var(--accent);
      color: #000;
      outline: 0;
    }

    .controls {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .controls button {
      min-height: 52px;
    }

    .credits {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      overflow: hidden;
      background: #000;
      color: var(--ink);
      text-align: center;
    }

    .credits.active {
      display: block;
    }

    .starfield {
      position: absolute;
      inset: -30%;
      background-image: radial-gradient(circle, rgba(255,255,255,0.85) 1px, transparent 1px);
      background-size: 120px 120px;
      animation: stars 28s linear infinite;
      opacity: 0.35;
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti i {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 8px;
      animation: confettiDrop 3s linear infinite;
    }

    .roll {
      position: absolute;
      left: 50%;
      top: 100%;
      width: min(720px, calc(100% - 32px));
      transform: translateX(-50%);
      animation: rollUp 10s linear forwards;
    }

    .credit-kicker,
    .credit-small {
      color: var(--muted);
      font-size: clamp(13px, 2.6vw, 18px);
      line-height: 1.7;
    }

    .credit-name {
      margin: 18px 0;
      color: var(--ink);
      font-size: clamp(24px, 6vw, 54px);
      line-height: 1.15;
      text-transform: uppercase;
    }

    .promotion {
      display: block;
      margin-top: 14px;
      color: var(--accent);
      animation: blink 850ms steps(2, end) infinite;
    }

    .defeated {
      margin: 52px auto;
      display: grid;
      gap: 13px;
    }

    .defeated div {
      color: var(--danger);
      font-size: clamp(14px, 2.8vw, 20px);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .final-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms steps(3, end);
    }

    .final-card.active {
      opacity: 1;
      pointer-events: auto;
    }

    .final-inner {
      width: min(700px, 100%);
      border: 2px solid var(--accent);
      background: #000;
      padding: clamp(22px, 5vw, 42px);
    }

    .final-title {
      margin: 0 0 20px;
      color: var(--ink);
      font-size: clamp(22px, 5vw, 48px);
      line-height: 1.16;
      text-transform: uppercase;
    }

    .vendor {
      margin: 0 0 20px;
      color: var(--accent);
      font-size: clamp(15px, 3vw, 24px);
      line-height: 1.45;
      text-transform: uppercase;
    }

    @keyframes stars {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-120px, 180px, 0); }
    }

    @keyframes rollUp {
      from { top: 100%; }
      to { top: -85%; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }

    @keyframes confettiDrop {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(110vh) rotate(180deg); }
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .hud {
        justify-content: flex-start;
        text-align: left;
      }

      .screen {
        aspect-ratio: 9 / 13;
        max-height: none;
      }

      .controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main class="arcade" aria-label="GTM Hero game">
    <header class="topbar">
      <div>
        <h1>GTM HERO</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="hud" aria-live="polite">
        <span id="score">0000</span>
        <span id="lives">LIVES 3</span>
        <span id="wave">WAVE 1</span>
      </div>
    </header>

    <section class="screen">
      <canvas id="game" width="920" height="575"></canvas>
      <div class="overlay" id="startOverlay">
        <div class="prompt">
          <h2 id="startTitle"></h2>
          <p id="startCopy"></p>
          <button id="startButton" type="button">PLAY</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Touch controls">
      <button type="button" data-touch="left">LEFT</button>
      <button type="button" data-touch="shoot">FIRE</button>
      <button type="button" data-touch="right">RIGHT</button>
    </div>
  </main>

  <section class="credits" id="credits" aria-hidden="true">
    <div class="starfield"></div>
    <div class="confetti" id="confetti"></div>
    <div class="roll" id="creditRoll"></div>
    <div class="final-card" id="finalCard"></div>
  </section>

  <script>
    /*
      EDIT THIS BLOCK ONLY.
      Swap the values below to make a new personalised GTM Hero game.
      Keep the quote marks and commas, then refresh the browser.
    */
    const CONFIG = {
      playerName: "Alex Rivera",
      playerTitle: "Head of People",
      company: "ElevenLabs",
      vendorName: "Kota",
      promotionTitle: "Chief People Officer",
      enemies: [
        "Manual benefits admin",
        "Fragmented health cover",
        "Clunky onboarding",
        "Compliance headaches"
      ],
      vendorTagline: "Kota makes benefits one click.",
      vendorAccentColor: "#00ff66",
      ctaUrl: "https://www.kota.io/"
    };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const waveEl = document.getElementById("wave");
    const subtitleEl = document.getElementById("subtitle");
    const startOverlay = document.getElementById("startOverlay");
    const startTitle = document.getElementById("startTitle");
    const startCopy = document.getElementById("startCopy");
    const startButton = document.getElementById("startButton");
    const creditsEl = document.getElementById("credits");
    const creditRoll = document.getElementById("creditRoll");
    const finalCard = document.getElementById("finalCard");
    const confettiEl = document.getElementById("confetti");

    const root = document.documentElement;
    const enemyLabels = CONFIG.enemies.slice(0, 4);
    const biggestPain = enemyLabels[0] || "Blocker";
    const keys = new Set();
    const touch = { left: false, right: false, shoot: false };
    const confettiColors = ["#ff3b3b", "#ffd84d", "#00ff66", "#4db8ff", "#ffffff"];

    let gameState = "ready";
    let lastTime = 0;
    let shootCooldown = 0;
    let enemyShootTimer = 0;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let player;
    let bullets;
    let enemyBullets;
    let particles;
    let invaders;
    let boss;
    let stars;
    let flash = 0;
    let winFade = 0;
    let winTimer = 0;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function setupPersonalization() {
      root.style.setProperty("--accent", CONFIG.vendorAccentColor || "#00ff66");
      subtitleEl.textContent = `${CONFIG.playerName} / ${CONFIG.company}`;
      startTitle.textContent = "READY?";
      startCopy.textContent = "Clear the invaders.";
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      player = {
        x: canvas.width / 2,
        y: canvas.height - 48,
        w: 42,
        h: 26,
        speed: 390,
        invulnerable: 0
      };
      bullets = [];
      enemyBullets = [];
      particles = [];
      boss = null;
      invaders = createInvaders();
      stars = Array.from({ length: 44 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() > 0.75 ? 2 : 1
      }));
      winFade = 0;
      winTimer = 0;
      enemyShootTimer = 1.2;
      updateHud();
    }

    function createInvaders() {
      const rows = Math.max(3, enemyLabels.length);
      const cols = 2;
      const list = [];
      const blockW = Math.min(300, (canvas.width - 110) / cols);
      const blockH = 50;
      const gapX = 18;
      const gapY = 18;
      const startX = (canvas.width - (cols * blockW + (cols - 1) * gapX)) / 2;
      const startY = 74;

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          list.push({
            x: startX + col * (blockW + gapX),
            y: startY + row * (blockH + gapY),
            w: blockW,
            h: blockH,
            label: enemyLabels[row % enemyLabels.length],
            alive: true
          });
        }
      }

      return { list, dir: 1, speed: 16, drop: 16 };
    }

    function startBossWave() {
      wave = 2;
      enemyBullets = [];
      boss = {
        x: canvas.width / 2 - 150,
        y: 82,
        w: 300,
        h: 70,
        hp: 7,
        maxHp: 7,
        dir: 1,
        speed: 44,
        label: biggestPain
      };
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = String(score).padStart(4, "0");
      livesEl.textContent = `LIVES ${lives}`;
      waveEl.textContent = `WAVE ${wave}`;
    }

    function beginMission() {
      resetGame();
      gameState = "playing";
      startOverlay.classList.add("hidden");
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      if (gameState === "playing") requestAnimationFrame(loop);
    }

    function update(dt) {
      updatePlayer(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateEnemyBullets(dt);
      updateParticles(dt);
      shootCooldown = Math.max(0, shootCooldown - dt);
      flash = Math.max(0, flash - dt);
      if (player.invulnerable > 0) player.invulnerable -= dt;
    }

    function updatePlayer(dt) {
      const left = keys.has("ArrowLeft") || keys.has("a") || keys.has("A") || touch.left;
      const right = keys.has("ArrowRight") || keys.has("d") || keys.has("D") || touch.right;
      const firing = keys.has(" ") || touch.shoot;
      const direction = (right ? 1 : 0) - (left ? 1 : 0);
      player.x += direction * player.speed * dt;
      player.x = Math.max(player.w / 2 + 12, Math.min(canvas.width - player.w / 2 - 12, player.x));

      if (firing && shootCooldown <= 0) {
        bullets.push({ x: player.x, y: player.y - 20, w: 5, h: 16, vy: -520 });
        shootCooldown = 0.2;
      }
    }

    function updateBullets(dt) {
      for (const bullet of bullets) bullet.y += bullet.vy * dt;
      bullets = bullets.filter((bullet) => bullet.y > -30);

      for (const bullet of bullets) {
        if (boss && rectHit(bullet, boss)) {
          bullet.dead = true;
          boss.hp -= 1;
          score += 75;
          burst(bullet.x, bullet.y, "#ffffff", 8);
          if (boss.hp <= 0) {
            score += 900;
            burst(boss.x + boss.w / 2, boss.y + boss.h / 2, "#ffd84d", 34);
            winGame();
          }
          updateHud();
          continue;
        }

        for (const enemy of invaders.list) {
          if (enemy.alive && rectHit(bullet, enemy)) {
            bullet.dead = true;
            enemy.alive = false;
            score += 100;
            burst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#ffffff", 10);
            updateHud();
            break;
          }
        }
      }

      bullets = bullets.filter((bullet) => !bullet.dead);

      if (!boss && invaders.list.every((enemy) => !enemy.alive)) {
        startBossWave();
      }
    }

    function updateEnemies(dt) {
      const alive = invaders.list.filter((enemy) => enemy.alive);
      if (alive.length) {
        let edge = false;
        for (const enemy of alive) {
          enemy.x += invaders.dir * invaders.speed * dt;
          if (enemy.x < 18 || enemy.x + enemy.w > canvas.width - 18) edge = true;
          if (enemy.y + enemy.h > player.y - 22) loseLife();
        }
        if (edge) {
          invaders.dir *= -1;
          for (const enemy of alive) enemy.y += invaders.drop;
        }
      }

      if (boss) {
        boss.x += boss.dir * boss.speed * dt;
        if (boss.x < 24 || boss.x + boss.w > canvas.width - 24) boss.dir *= -1;
      }

      enemyShootTimer -= dt;
      if (enemyShootTimer <= 0) {
        enemyShootTimer = boss ? 1.35 : 1.75;
        enemyShoot();
      }
    }

    function enemyShoot() {
      if (boss) {
        enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h + 8, w: 5, h: 14, vy: 165 });
        return;
      }

      const alive = invaders.list.filter((enemy) => enemy.alive);
      if (!alive.length) return;
      const enemy = alive[Math.floor(Math.random() * alive.length)];
      enemyBullets.push({
        x: enemy.x + enemy.w / 2,
        y: enemy.y + enemy.h + 4,
        w: 5,
        h: 13,
        vy: 145
      });
    }

    function updateEnemyBullets(dt) {
      for (const bullet of enemyBullets) bullet.y += bullet.vy * dt;
      enemyBullets = enemyBullets.filter((bullet) => bullet.y < canvas.height + 24);

      for (const bullet of enemyBullets) {
        if (player.invulnerable <= 0 && rectHit(bullet, {
          x: player.x - player.w / 2,
          y: player.y - player.h / 2,
          w: player.w,
          h: player.h
        })) {
          bullet.dead = true;
          loseLife();
        }
      }
      enemyBullets = enemyBullets.filter((bullet) => !bullet.dead);
    }

    function updateParticles(dt) {
      for (const bit of particles) {
        bit.x += bit.vx * dt;
        bit.y += bit.vy * dt;
        bit.life -= dt;
      }
      particles = particles.filter((bit) => bit.life > 0);
    }

    function loseLife() {
      if (player.invulnerable > 0) return;
      lives -= 1;
      flash = 0.16;
      player.invulnerable = 1.25;
      burst(player.x, player.y, "#ff3b3b", 16);
      updateHud();

      if (lives <= 0) {
        resetGame();
        startOverlay.classList.remove("hidden");
        startTitle.textContent = "GAME OVER";
        startCopy.textContent = "Try again.";
        gameState = "ready";
      }
    }

    function winGame() {
      gameState = "won";
      winFade = 0;
      winTimer = 0;
      lastTime = performance.now();
      requestAnimationFrame(winLoop);
      setTimeout(showCredits, 720);
    }

    function winLoop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      updateParticles(dt);
      winTimer += dt;
      winFade = Math.min(1, winTimer / 0.65);
      draw();
      if (gameState === "won" && winFade < 1) requestAnimationFrame(winLoop);
    }

    function showCredits() {
      creditsEl.classList.add("active");
      creditsEl.setAttribute("aria-hidden", "false");
      renderConfetti();
      creditRoll.innerHTML = `
        <div class="credit-kicker">STARRING</div>
        <div class="credit-name">
          ${escapeHTML(CONFIG.playerName)}
          <span class="promotion">${escapeHTML(CONFIG.promotionTitle)}</span>
        </div>
        <div class="credit-kicker">${escapeHTML(CONFIG.company)}</div>
        <div class="defeated">
          <div>DEFEATED</div>
          ${enemyLabels.map((label) => `<div>${escapeHTML(label)}</div>`).join("")}
        </div>
        <div class="credit-small">${escapeHTML(CONFIG.vendorName)} - ${escapeHTML(CONFIG.vendorTagline)}</div>
      `;
      finalCard.innerHTML = `
        <div class="final-inner">
          <h2 class="final-title">${escapeHTML(CONFIG.playerName)}<br>${escapeHTML(CONFIG.promotionTitle)}<br>${escapeHTML(CONFIG.company)}</h2>
          <p class="vendor">${escapeHTML(CONFIG.vendorName)}</p>
          <a class="cta" href="${escapeHTML(CONFIG.ctaUrl || "#")}" target="_blank" rel="noopener">See how ${escapeHTML(CONFIG.vendorName)} does it →</a>
        </div>
      `;
      setTimeout(() => finalCard.classList.add("active"), 9800);
    }

    function renderConfetti() {
      confettiEl.innerHTML = "";
      for (let i = 0; i < 32; i += 1) {
        const piece = document.createElement("i");
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = confettiColors[i % confettiColors.length];
        piece.style.animationDelay = `${Math.random() * 2.8}s`;
        piece.style.animationDuration = `${2.4 + Math.random() * 1.4}s`;
        confettiEl.appendChild(piece);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawPlayer();
      drawInvaders();
      drawBoss();
      drawBullets();
      drawParticles();
      drawForeground();
    }

    function drawBackground() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      for (const star of stars) {
        ctx.fillRect(Math.round(star.x), Math.round(star.y), star.size, star.size);
      }
    }

    function drawPlayer() {
      const blink = player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0;
      if (blink) return;
      ctx.fillStyle = CONFIG.vendorAccentColor || "#00ff66";
      ctx.fillRect(player.x - 20, player.y + 8, 40, 8);
      ctx.fillRect(player.x - 12, player.y, 24, 8);
      ctx.fillRect(player.x - 4, player.y - 12, 8, 12);
      ctx.fillStyle = "#000";
      ctx.fillRect(player.x - 4, player.y + 10, 8, 4);
    }

    function drawInvaders() {
      for (const enemy of invaders.list) {
        if (!enemy.alive) continue;
        drawEnemyBlock(enemy.x, enemy.y, enemy.w, enemy.h, enemy.label, "#f4f4f4");
      }
    }

    function drawBoss() {
      if (!boss) return;
      drawEnemyBlock(boss.x, boss.y, boss.w, boss.h, boss.label, "#ffd84d");
      ctx.fillStyle = "#444";
      ctx.fillRect(boss.x, boss.y + boss.h + 9, boss.w, 8);
      ctx.fillStyle = CONFIG.vendorAccentColor || "#00ff66";
      ctx.fillRect(boss.x, boss.y + boss.h + 9, boss.w * (boss.hp / boss.maxHp), 8);
    }

    function drawEnemyBlock(x, y, w, h, label, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x + 10, y + 10, 8, 8);
      ctx.fillRect(x + w - 18, y + 10, 8, 8);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#f4f4f4";
      fitText(label, x + w / 2, y + h / 2 + 6, w - 24, 14);
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.fillStyle = CONFIG.vendorAccentColor || "#00ff66";
        ctx.fillRect(bullet.x - bullet.w / 2, bullet.y - bullet.h / 2, bullet.w, bullet.h);
      }
      for (const bullet of enemyBullets) {
        ctx.fillStyle = "#ff3b3b";
        ctx.fillRect(bullet.x - bullet.w / 2, bullet.y - bullet.h / 2, bullet.w, bullet.h);
      }
    }

    function drawParticles() {
      for (const bit of particles) {
        ctx.globalAlpha = Math.max(0, bit.life / bit.maxLife);
        ctx.fillStyle = bit.color;
        ctx.fillRect(bit.x, bit.y, bit.size, bit.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawForeground() {
      ctx.fillStyle = CONFIG.vendorAccentColor || "#00ff66";
      ctx.fillRect(14, canvas.height - 18, canvas.width - 28, 2);
      if (flash > 0) {
        ctx.fillStyle = `rgba(255, 59, 59, ${flash * 2})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (gameState === "won") {
        ctx.fillStyle = `rgba(0, 0, 0, ${winFade})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function fitText(text, x, y, maxWidth, maxSize) {
      let size = maxSize;
      ctx.font = `${size}px "Courier New", monospace`;
      while (ctx.measureText(text).width > maxWidth && size > 8) {
        size -= 1;
        ctx.font = `${size}px "Courier New", monospace`;
      }
      ctx.fillText(text, x, y);
    }

    function burst(x, y, color, amount) {
      for (let i = 0; i < amount; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 120;
        const life = 0.2 + Math.random() * 0.35;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 3,
          color,
          life,
          maxLife: life
        });
      }
    }

    function rectHit(a, b) {
      const ax = a.x - (a.w ? a.w / 2 : 0);
      const ay = a.y - (a.h ? a.h / 2 : 0);
      const aw = a.w || 0;
      const ah = a.h || 0;
      return ax < b.x + b.w && ax + aw > b.x && ay < b.y + b.h && ay + ah > b.y;
    }

    function resizeCanvas() {
      const screen = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.floor(screen.width);
      canvas.height = Math.floor(screen.height);
      if (gameState === "playing") player.y = canvas.height - 48;
      draw();
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", " ", "a", "A", "d", "D"].includes(event.key)) {
        event.preventDefault();
        keys.add(event.key);
        if (gameState === "ready" && event.key === " ") beginMission();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
    });

    for (const button of document.querySelectorAll("[data-touch]")) {
      const action = button.dataset.touch;
      button.addEventListener("pointerdown", () => {
        touch[action] = true;
        if (gameState === "ready" && action === "shoot") beginMission();
      });
      button.addEventListener("pointerup", () => { touch[action] = false; });
      button.addEventListener("pointerleave", () => { touch[action] = false; });
      button.addEventListener("pointercancel", () => { touch[action] = false; });
    }

    startButton.addEventListener("click", beginMission);
    window.addEventListener("resize", () => {
      resizeCanvas();
      resetGame();
    });

    setupPersonalization();
    resetGame();
    resizeCanvas();
  </script>
</body>
</html>
