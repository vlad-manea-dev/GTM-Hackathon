<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GTM Hero — device matrix</title>
<style>
  body{ background:#15171c; color:#8a94a6; font:12px system-ui; margin:0; padding:16px;
        display:flex; gap:18px; align-items:flex-start; }
  figure{ margin:0; }
  figcaption{ padding:6px 0; }
  iframe{ border:1px solid #333; display:block; background:#000; }
</style>
</head>
<body>
  <figure>
    <figcaption>iPhone 14 — 390×844</figcaption>
    <iframe src="/game.html" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>small Android — 360×640</figcaption>
    <iframe src="/game.html" width="360" height="640"></iframe>
  </figure>
  <figure>
    <figcaption>tablet portrait — 620×820</figcaption>
    <iframe src="/game.html" width="620" height="820"></iframe>
  </figure>
</body>
</html>
