<style>
  :root{
    --accent:#4DE3FF;   /* engine default; CONFIG.vendor.accentColor overrides at boot */
    --bg:#05060a;
    --threat:#ff4d6d;
    --ink:#e8f1ff;
    --font: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--font);
    overflow:hidden;
    -webkit-font-smoothing:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }

  canvas{ display:block; image-rendering:pixelated; background:#05060a; }

  /* ---- CRT treatment ---- */
  #crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.28) 3px, rgba(0,0,0,.28) 4px);
    mix-blend-mode:multiply;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 100%);
  }

  /* ---- DOM overlays (crisp text + a real, clickable CTA) ---- */
  .overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:20px;
  }

  .kicker{ font-size:10px; letter-spacing:.18em; color:#7d8ba5; }
  .title{
    font-size:clamp(22px, 7vw, 54px); line-height:1.25; color:#fff;
    text-shadow:0 0 12px var(--accent), 0 0 34px var(--accent);
  }
  .sub{ font-size:clamp(9px,2.6vw,13px); line-height:2; color:#9fb0cc; max-width:46ch; }
  .em{ color:var(--accent); }

  .blink{ animation:blink 1.15s steps(1,end) infinite; }
  @keyframes blink{ 50%{ opacity:0 } }

  .btn{
    display:inline-block; font-family:var(--font);
    font-size:clamp(10px,2.8vw,14px); line-height:1;
    padding:18px 24px; color:#ffffff; text-decoration:none;
    background:var(--accent); border:0; cursor:pointer;
    box-shadow:0 0 0 3px rgba(255,255,255,.14) inset, 0 0 26px var(--accent);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 0 0 3px rgba(255,255,255,.28) inset, 0 0 44px var(--accent);
    outline:none;
  }
  .btn.ghost{
    background:transparent; color:#8695af;
    box-shadow:0 0 0 2px #23303a inset; font-size:9px; padding:12px 16px;
  }
  .btn.ghost:hover{ color:#cfe0ff; box-shadow:0 0 0 2px #465b68 inset; transform:none; }

  /* ---- Credit roll ---- */
  #credits{ overflow:hidden; justify-content:flex-start; padding:0; }
  #roll{
    position:absolute; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    gap:34px; padding:0 24px; will-change:transform;
  }
  .cred{ max-width:46ch; }
  .cred .lbl{ font-size:9px; letter-spacing:.22em; color:#6d7d99; display:block; margin-bottom:14px; }
  .cred .val{ font-size:clamp(13px,4vw,24px); line-height:1.7; color:#fff; }
  .cred .val.glow{ text-shadow:0 0 14px var(--accent), 0 0 32px var(--accent); }
  .cred ul{ list-style:none; margin:0; padding:0; }
  .cred li{
    font-size:clamp(10px,3vw,15px); line-height:2.2;
    color:#6b7690; text-decoration:line-through;
    text-decoration-color:var(--threat); text-decoration-thickness:3px;
  }

  #skip{ position:fixed; right:16px; bottom:16px; z-index:45; }

  #touchhint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    z-index:41; font-size:8px; color:#5d6b85; letter-spacing:.14em; pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){ .blink{ animation:none; } }
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>

<div class="overlay" id="attract">
  <div class="kicker" id="a-kicker"></div>
  <div class="title" id="a-title">GTM HERO</div>
  <div class="sub" id="a-sub"></div>
  <button class="btn" id="a-start">PRESS START</button>
  <div class="sub blink" style="font-size:9px;color:#5d6b85" id="a-hint"></div>
</div>

<div class="overlay" id="gameover" hidden>
  <div class="title" style="color:var(--threat);text-shadow:0 0 12px var(--threat),0 0 34px var(--threat)">GAME OVER</div>
  <div class="sub" id="go-sub"></div>
  <button class="btn" id="go-retry">TRY AGAIN</button>
  <button class="btn ghost" id="go-skip">SEE HOW IT ENDS →</button>
</div>

<div class="overlay" id="credits" hidden><div id="roll"></div></div>
<button class="btn ghost" id="skip" hidden>SKIP TO THE ENDING</button>

<div class="overlay" id="final" hidden>
  <div class="kicker" id="f-kicker"></div>
  <div class="title" id="f-title"></div>
  <div class="sub" id="f-sub"></div>
  <a class="btn" id="f-cta" href="#" target="_blank" rel="noopener"></a>
  <button class="btn ghost" id="f-replay">PLAY AGAIN</button>
</div>

<div id="touchhint" hidden>DRAG TO MOVE — YOU FIRE AUTOMATICALLY</div>
<div id="crt"></div>
<div id="vignette"></div>

<script>
(() => {
"use strict";

/* --------------------------------------------------------------------------
   1. DERIVED CONSTANTS  (nothing prospect-specific below this line)
   -------------------------------------------------------------------------- */

const PERSON  = CONFIG.person  || {};
const COMPANY = CONFIG.company || {};
const VENDOR  = CONFIG.vendor  || {};
const STORY   = CONFIG.story   || {};
const ACCENT  = VENDOR.accentColor || "#4DE3FF";
const THREAT  = "#ff4d6d";

// Enemies accept either a plain string or { name, logo }. Anything else is
// dropped, and we cap at 4 rows so the board never overflows the screen.
const ENEMIES = (CONFIG.enemies || [])
  .map(e => typeof e === "string" ? { name: e } : e)
  .filter(e => e && typeof e.name === "string" && e.name.trim())
  .slice(0, 4);

document.documentElement.style.setProperty("--accent", ACCENT);

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const TOUCH   = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

// Logical canvas space. Everything is authored in these units and scaled to fit.
const VIEW = { w: 960, h: 720, scale: 1 };

// Tuning — deliberately forgiving. A non-gamer must win in ~60 seconds.
const T = {
  playerSpeed:  440,   // logical px/s
  bulletSpeed:  780,
  fireCooldown: 0.18,  // s
  maxBullets:   4,
  bombSpeed:    210,
  maxBombs:     2,
  bombChance:   0.22,  // per march step
  marchStart:   0.62,  // s between formation steps when full

  lives:        3,
  continues:    1,     // one automatic second wind before it can end badly
  invulnTime:   2.0,
  hitPadding:   6      // collision generosity, in the player's favour
};

const LOGO_RES = 20;   // pixel-art resolution every logo is reduced to

// The ship's line, as a fraction of canvas height — referenced by both the

const playerY = () => Math.round(VIEW.h * 0.90);

const rand  = (a, b) => a + Math.random() * (b - a);

// Escapes anything from CONFIG before it touches innerHTML.
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
const up = s => String(s == null ? "" : s).toUpperCase();

/* --------------------------------------------------------------------------
   3. SPRITES
   Sprites are rows of "1"/"0". Competitor logos are converted into exactly
   that format at boot, so a real logo and a hand-drawn invader render through
   the same code path — and any logo comes out looking like arcade pixel art.
   -------------------------------------------------------------------------- */

const SPR_INVADER = [
  "00100000100",
  "00010001000",
  "00111111100",
  "01101110110",
  "11111111111",
  "10111111101",
  "10100000101",
  "00011011000"
];
const SPR_INVADER_B = [
  "00100000100",
  "10010001001",
  "10111111101",
  "11101110111",
  "11111111111",
  "01111111110",
  "00100000100",
  "01000000010"
];
const SPR_SHIP = [
  "00000100000",
  "00001110000",
  "00001110000",
  "01111111110",
  "11111111111",
  "11111111111",
  "11011111011"
];

function drawSprite(ctx, rows, x, y, px, color){
  ctx.fillStyle = color;
  for (let r = 0; r < rows.length; r++){
    const row = rows[r];
    for (let c = 0; c < row.length; c++){
      if (row[c] === "1") ctx.fillRect(x + c*px, y + r*px, px, px);
    }
  }
}
const sprW = (rows, px) => rows[0].length * px;
const sprH = (rows, px) => rows.length * px;

// Crop fully-empty rows/columns so every logo fills its cell evenly.
function trimGrid(rows){
  let top = 0, bot = rows.length - 1;
  while (top < bot && !rows[top].includes("1")) top++;
  while (bot > top && !rows[bot].includes("1")) bot--;
  const slice = rows.slice(top, bot + 1);
  if (!slice.length) return null;

  let left = 0, right = slice[0].length - 1;
  const colOn = c => slice.some(r => r[c] === "1");
  while (left < right && !colOn(left)) left++;
  while (right > left && !colOn(right)) right--;

  const out = slice.map(r => r.slice(left, right + 1));
  return out[0].length ? out : null;
}

// Any square image -> a 1/0 pixel grid.
// Logos arrive in three flavours: transparent (alpha mask), a mark on a white
// tile, and a mark on a dark tile. Rather than guess, we sample the corners to
// learn the tile colour and keep whatever contrasts against it — which covers
// all three with one rule.
function imageToGrid(img, res){
  const c = document.createElement("canvas");
  c.width = c.height = res;
  const g = c.getContext("2d", { willReadFrequently: true });

  const s = Math.min(res / img.width, res / img.height);
  const w = img.width * s, h = img.height * s;
  g.clearRect(0, 0, res, res);
  g.drawImage(img, (res - w) / 2, (res - h) / 2, w, h);

  let d;
  try { d = g.getImageData(0, 0, res, res).data; }
  catch { return null; }                     // tainted canvas — fall back

  const at = (x, y) => (y * res + x) * 4;
  const lum = i => d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;

  // Find the tile colour, if there is one, by looking at the border ring only.
  // Corners alone are unreliable — most favicons are rounded, so the corners
  // are transparent even when the icon sits on a solid tile.
  const ring = [];
  for (let x = 0; x < res; x++){ ring.push(at(x,0), at(x,res-1)); }
  for (let y = 1; y < res-1; y++){ ring.push(at(0,y), at(res-1,y)); }

  const bucket = i => `${d[i]>>4},${d[i+1]>>4},${d[i+2]>>4}`;
  const tally = new Map();
  let opaqueRing = 0;
  for (const i of ring){
    if (d[i+3] < 200) continue;
    opaqueRing++;
    const k = bucket(i);
    tally.set(k, (tally.get(k) || 0) + 1);
  }

  let bg = null;
  if (opaqueRing > ring.length * 0.5){
    let best = null, bestN = 0;
    for (const [k, n] of tally) if (n > bestN){ bestN = n; best = k; }
    // Only call it a tile if one colour actually dominates the border.
    if (best && bestN > opaqueRing * 0.6){
      bg = best.split(",").map(v => (+v << 4) + 8);
    }
  }

  // The modal colour among opaque pixels — usually a badge fill that should be
  // knocked out so the glyph inside it survives.
  const inkTally = new Map();
  let opaqueTotal = 0;
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 110) continue;
    opaqueTotal++;
    const k = bucket(i);
    inkTally.set(k, (inkTally.get(k) || 0) + 1);
  }
  let fill = null, fillN = 0;
  for (const [k, n] of inkTally) if (n > fillN){ fillN = n; fill = k; }
  const fillRgb = fill ? fill.split(",").map(v => (+v << 4) + 8) : null;

  const near = (i, c) => Math.abs(d[i]-c[0]) + Math.abs(d[i+1]-c[1]) + Math.abs(d[i+2]-c[2]) <= 90;

  // dropFill: also knock out the dominant fill colour. Tried second, because
  // on a plain single-colour mark it would erase the whole logo.
  const build = dropFill => {
    const rows = [];
    for (let y = 0; y < res; y++){
      let line = "";
      for (let x = 0; x < res; x++){
        const i = at(x, y);
        let on = d[i+3] > 110;
        if (on && bg) on = !near(i, bg);            // drop the tile
        if (on) on = lum(i) < 235;                  // drop near-white interior holes
        if (on && dropFill && fillRgb) on = !near(i, fillRgb);
        line += on ? "1" : "0";
      }
      rows.push(line);
    }
    return trimGrid(rows);
  };

  const density = g => {
    if (!g) return 0;
    return (g.join("").split("1").length - 1) / (g.length * g[0].length);
  };

  let grid = build(false);
  // Still a featureless slab? The badge fill is swallowing the glyph — knock it
  // out too, but only if that leaves enough of a shape to be worth drawing.
  if (density(grid) > 0.8 && fillN < opaqueTotal * 0.9){
    const punched = build(true);
    if (density(punched) > 0.12) grid = punched;
  }

  // A grid that is still almost entirely filled is a silhouette, not a logo —
  // it would read as a featureless block, so use the classic invader instead.
  return density(grid) > 0.92 ? null : grid;
}

// Resolve every enemy to a sprite grid. Never rejects: a slow, broken or
// missing logo just yields the classic invader.
function loadEnemySprites(){
  return Promise.all(ENEMIES.map(e => new Promise(resolve => {
    if (!e.logo){ resolve(null); return; }
    const img = new Image();
    let done = false;
    const finish = grid => { if (!done){ done = true; resolve(grid); } };
    img.onload  = () => { try { finish(imageToGrid(img, LOGO_RES)); } catch { finish(null); } };
    img.onerror = () => finish(null);
    setTimeout(() => finish(null), 2500);
    img.src = e.logo;
  }))).then(grids => {
    grids.forEach((g, i) => { ENEMIES[i].sprite = g || SPR_INVADER; ENEMIES[i].isLogo = !!g; });
  });
}

/* --------------------------------------------------------------------------
   4. CANVAS + RESPONSIVE SIZING
   -------------------------------------------------------------------------- */

const cv  = $("game");
const ctx = cv.getContext("2d", { alpha: false });

function layoutCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;

  // Logical width is clamped so labels are never absurdly cramped or stretched;
  // logical height then follows the viewport's exact aspect so the canvas fills
  // the screen. Pinning the height instead would letterbox a tall phone with
  // dead bands top and bottom — which is most of the screen on an iPhone.
  const aspect = vw / vh;
  VIEW.w = Math.round(clamp(720 * aspect, 460, 1140));
  VIEW.h = Math.round(VIEW.w / aspect);

  VIEW.scale = Math.min(vw / VIEW.w, vh / VIEW.h);
  const dpr = clamp(window.devicePixelRatio || 1, 1, 2);

  cv.width  = Math.round(VIEW.w * VIEW.scale * dpr);
  cv.height = Math.round(VIEW.h * VIEW.scale * dpr);
  cv.style.width  = Math.round(VIEW.w * VIEW.scale) + "px";
  cv.style.height = Math.round(VIEW.h * VIEW.scale) + "px";

  ctx.setTransform(VIEW.scale * dpr, 0, 0, VIEW.scale * dpr, 0, 0);
  ctx.textBaseline = "top";
}

/* --------------------------------------------------------------------------
   5. LABEL FITTING
   Competitor names are real text on a pixel canvas — the biggest legibility
   risk. Each label is wrapped and auto-shrunk once, up front, so it always
   fits on any screen.
   -------------------------------------------------------------------------- */

const FONT = size => `${size}px "Press Start 2P", ui-monospace, monospace`;

function wrapWords(text, maxW, size){
  ctx.font = FONT(size);
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width <= maxW || !line) line = test;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

function fitLabel(text, maxW, maxLines, startSize){
  let size = startSize;
  let lines = wrapWords(text, maxW, size);
  while (size > 7 && (lines.length > maxLines || lines.some(l => {
    ctx.font = FONT(size); return ctx.measureText(l).width > maxW;
  }))){
    size -= 1;
    lines = wrapWords(text, maxW, size);
  }
  return { lines, size };
}

/* --------------------------------------------------------------------------
   6. GAME STATE
   -------------------------------------------------------------------------- */

const SCENE = { ATTRACT:"attract", PLAY:"play", WIN:"win", LOSE:"lose", CREDITS:"credits", FINAL:"final" };
let scene = SCENE.ATTRACT;

const G = {
  invaders: [], rows: [], bullets: [], bombs: [], parts: [], toasts: [],
  player: null, spritePx: 3,
  dir: 1, marchTimer: 0, marchFrame: false, totalInvaders: 0,
  lives: T.lives, score: 0, invuln: 0, fireTimer: 0,
  shake: 0, flash: 0, winTimer: 0, elapsed: 0
};

// One competitor = one row: their name drawn ONCE and large, above a row of
// their logo rendered as invaders. A long name stays readable on a phone
// instead of being crammed into every sprite.
function buildFormation(){
  G.invaders = [];
  G.rows = [];
  const rowCount = ENEMIES.length;
  if (!rowCount) return;

  const cols = VIEW.w >= 900 ? 5 : VIEW.w >= 640 ? 4 : 3;

  // The whole formation has to fit between the HUD and the player, with room
  // left to descend. Work backwards from the space available rather than
  // trusting fixed sizes — 4 rows of tall logos would otherwise spawn on top
  // of the ship and kill it before the player touches anything. All of it is
  // proportional to VIEW.h, which now varies with the device.
  const topY       = Math.round(VIEW.h * 0.12);
  const DESCEND    = Math.round(VIEW.h * 0.12);   // headroom the formation marches into
  const availableH = playerY() - DESCEND - topY;
  const bandH      = Math.floor(availableH / rowCount);

  // On a short landscape window the label has to give ground to the sprites.
  const labelSize = clamp(Math.min(Math.round(VIEW.w / 62), Math.round(bandH * 0.30)), 9, 17);
  const fitted    = ENEMIES.map(e => fitLabel(up(e.name), VIEW.w * 0.86, 2, labelSize));
  const lineH     = Math.round(Math.max(...fitted.map(f => f.size)) * 1.5);
  const labelH    = Math.max(...fitted.map(f => f.lines.length)) * lineH + 12;

  // Sprite scale is whatever is left over once the label has its space.
  const gridH = Math.max(...ENEMIES.map(e => e.sprite.length));
  const px    = clamp(Math.floor((bandH - labelH - 20) / gridH), 2, 4);

  // Rows can have different logo shapes, so cells are sized to the widest.
  const dims = ENEMIES.map(e => ({ w: sprW(e.sprite, px), h: sprH(e.sprite, px) }));
  const sw = Math.max(...dims.map(d => d.w));
  const sh = Math.max(...dims.map(d => d.h));

  const gapX    = Math.round(sw * 0.55);
  const cellW   = sw + gapX;
  const formW   = cols * cellW - gapX;
  const originX = Math.round((VIEW.w - formW) / 2);

  for (let r = 0; r < rowCount; r++){
    const rowTop = topY + r * bandH;
    G.rows.push({ label: fitted[r], labelH, lineH, sprite: ENEMIES[r].sprite });
    for (let c = 0; c < cols; c++){
      G.invaders.push({
        row: r, col: c,
        x: originX + c * cellW + Math.round((sw - dims[r].w) / 2),
        y: rowTop + labelH + Math.round((sh - dims[r].h) / 2),
        w: dims[r].w, h: dims[r].h,
        alive: true
      });
    }
  }
  G.totalInvaders = G.invaders.length;
  G.spritePx = px;
}

function resetGame(){
  G.bullets = []; G.bombs = []; G.parts = []; G.toasts = [];
  G.dir = 1; G.marchTimer = 0; G.marchFrame = false;
  G.lives = T.lives; G.continues = T.continues; G.score = 0;
  G.invuln = 0; G.fireTimer = 0; G.shake = 0; G.flash = 0;
  G.winTimer = 0; G.elapsed = 0;
  buildFormation();
  G.player = { x: VIEW.w / 2, y: playerY(), px: 4 };
}

/* --------------------------------------------------------------------------
   7. INPUT
   -------------------------------------------------------------------------- */

const keys = Object.create(null);
let pointerTargetX = null;

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowleft","arrowright","a","d"," ","spacebar"].includes(k)) e.preventDefault();
  keys[k] = true;
  if ((k === " " || k === "enter") && scene === SCENE.ATTRACT) startGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function canvasX(clientX){
  const r = cv.getBoundingClientRect();
  return clamp((clientX - r.left) / VIEW.scale, 0, VIEW.w);
}
function onPointer(e){
  if (scene !== SCENE.PLAY) return;
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  if (t) pointerTargetX = canvasX(t.clientX);
}
cv.addEventListener("touchstart", onPointer, { passive:false });
cv.addEventListener("touchmove",  onPointer, { passive:false });
cv.addEventListener("touchend",   () => { pointerTargetX = null; }, { passive:true });
cv.addEventListener("mousedown",  onPointer);
cv.addEventListener("mousemove",  e => { if (e.buttons) onPointer(e); });
addEventListener("mouseup", () => { pointerTargetX = null; });

/* --------------------------------------------------------------------------
   8. SIMULATION
   -------------------------------------------------------------------------- */

function fire(){
  if (G.fireTimer > 0 || G.bullets.length >= T.maxBullets) return;
  G.fireTimer = T.fireCooldown;
  G.bullets.push({ x: G.player.x, y: G.player.y - 16, alive: true });
}

function updatePlay(dt){
  G.elapsed += dt;
  G.fireTimer -= dt;
  if (G.invuln > 0) G.invuln -= dt;

  // --- player ---
  const p = G.player;
  const left  = keys["arrowleft"]  || keys["a"];
  const right = keys["arrowright"] || keys["d"];

  if (pointerTargetX != null){
    const d = pointerTargetX - p.x;
    p.x += clamp(d, -T.playerSpeed * dt, T.playerSpeed * dt);
    fire();                              // pointer/touch play auto-fires — forgiving by design
  } else {
    if (left)  p.x -= T.playerSpeed * dt;
    if (right) p.x += T.playerSpeed * dt;
  }
  if (keys[" "] || keys["spacebar"]) fire();

  const halfShip = sprW(SPR_SHIP, p.px) / 2;
  p.x = clamp(p.x, halfShip + 6, VIEW.w - halfShip - 6);

  // --- bullets ---
  for (const b of G.bullets){
    b.y -= T.bulletSpeed * dt;
    if (b.y < -20) b.alive = false;
  }

  // --- formation march (speeds up as the board clears) ---
  const aliveList = G.invaders.filter(i => i.alive);
  const frac = G.totalInvaders ? aliveList.length / G.totalInvaders : 0;
  const stepEvery = T.marchEnd + (T.marchStart - T.marchEnd) * frac;

  G.marchTimer += dt;
  if (G.marchTimer >= stepEvery && aliveList.length){
    G.marchTimer = 0;
    G.marchFrame = !G.marchFrame;

    const stepX = Math.max(8, VIEW.w * 0.016);
    const minX = Math.min(...aliveList.map(i => i.x));
    const maxX = Math.max(...aliveList.map(i => i.x + i.w));

    if ((G.dir > 0 && maxX + stepX > VIEW.w - 24) || (G.dir < 0 && minX - stepX < 24)){
      G.dir *= -1;
      // Descend, but never past the stall line. This asset exists to be won —
      // a prospect must not be able to lose it by standing still, and on a
      // short landscape window the formation would otherwise land on the ship.
      const lowest = Math.max(...aliveList.map(i => i.y + i.h));
      const stall  = playerY() - Math.round(VIEW.h * 0.16);
      const step   = Math.min(Math.round(VIEW.h * 0.025), Math.max(0, stall - lowest));
      for (const i of G.invaders) i.y += step;
    } else {
      for (const i of G.invaders) i.x += stepX * G.dir;
    }

    if (G.bombs.length < T.maxBombs && Math.random() < T.bombChance){
      const shooter = aliveList[(Math.random() * aliveList.length) | 0];
      G.bombs.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, alive: true });
    }
  }

  for (const b of G.bombs){
    b.y += T.bombSpeed * dt;
    if (b.y > VIEW.h + 20) b.alive = false;
  }

  // --- bullet vs invader ---
  for (const b of G.bullets){
    if (!b.alive) continue;
    for (const inv of G.invaders){
      if (!inv.alive) continue;
      if (b.x > inv.x - T.hitPadding && b.x < inv.x + inv.w + T.hitPadding &&
          b.y > inv.y - T.hitPadding && b.y < inv.y + inv.h + T.hitPadding){
        b.alive = false; inv.alive = false;
        G.score += 100;
        G.shake = Math.min(G.shake + 3, 9);
        burst(inv.x + inv.w/2, inv.y + inv.h/2, THREAT, 14);

        // Whole competitor cleared? Stamp it.
        if (!G.invaders.some(i => i.alive && i.row === inv.row)){
          G.toasts.push({ text: up(ENEMIES[inv.row].name), t: 0, life: 2.2 });
          G.flash = 0.25;
          G.score += 500;
        }
        break;
      }
    }
  }

  // --- bomb / invader vs player ---
  if (G.invuln <= 0){
    for (const b of G.bombs){
      if (!b.alive) continue;
      if (Math.abs(b.x - p.x) < 9 && Math.abs(b.y - p.y) < 14){ b.alive = false; loseLife(); }
    }
  }

  // --- cleanup ---
  G.bullets = G.bullets.filter(b => b.alive);
  G.bombs   = G.bombs.filter(b => b.alive);
  updateParticles(dt);
  for (const t of G.toasts) t.t += dt;
  G.toasts = G.toasts.filter(t => t.t < t.life);

  G.shake = Math.max(0, G.shake - dt * 22);
  G.flash = Math.max(0, G.flash - dt);

  if (!G.invaders.some(i => i.alive)){
    G.score += G.lives * 1000;
    setScene(SCENE.WIN);
  }
}

function loseLife(){
  G.lives--;
  G.invuln = T.invulnTime;
  G.shake = 10;
  burst(G.player.x, G.player.y, ACCENT, 26);

  if (G.lives <= 0 && G.continues > 0){
    // A prospect opening this from an email gets one free save. The stakes
    // stay visible, but the story almost always reaches its ending.
    G.continues--;
    G.lives = T.lives;
    G.invuln = 2.6;
    G.bombs = [];
    G.toasts.push({ text: "SECOND WIND", t: 0, life: 1.8, plain: true });
    return;
  }

  if (G.lives <= 0) setScene(SCENE.LOSE);
  else {
    // Push the formation back up so one hit never cascades into an instant loss.
    for (const i of G.invaders) i.y -= Math.round(VIEW.h * 0.05);
    G.bombs = [];
  }
}

function burst(x, y, color, n){
  if (REDUCED) n = Math.min(n, 6);
  for (let i = 0; i < n; i++){
    const a = rand(0, Math.PI * 2), s = rand(40, 240);
    G.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(.3,.8), t:0, color, size: rand(2,4)|0 });
  }
}
function updateParticles(dt){
  for (const p of G.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 220*dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
}

/* --------------------------------------------------------------------------
   9. RENDER
   -------------------------------------------------------------------------- */

const stars = Array.from({length: 70}, () => ({ x: Math.random(), y: Math.random(), s: Math.random()*2+1 }));

function render(){
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));

  ctx.fillStyle = "#05060a";
  ctx.fillRect(-20, -20, VIEW.w + 40, VIEW.h + 40);
  drawStars();

  if (scene === SCENE.PLAY || scene === SCENE.WIN){
    drawInvaders();
    drawBullets();
    drawPlayer();
    drawParticles();
    drawHUD();
    drawToasts();
  }

  if (G.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  }
  ctx.restore();
}

function drawStars(){
  for (const s of stars){
    ctx.fillStyle = `rgba(255,255,255,${0.06 + s.s * 0.05})`;
    ctx.fillRect(s.x * VIEW.w, s.y * VIEW.h, s.s, s.s);
  }
}

function drawInvaders(){
  // Logos hold still (they're recognisable shapes); the fallback invader keeps
  // the classic two-frame wiggle.
  for (const inv of G.invaders){
    if (!inv.alive) continue;
    const e = ENEMIES[inv.row];
    const spr = e.isLogo ? e.sprite : (G.marchFrame ? SPR_INVADER_B : SPR_INVADER);
    drawSprite(ctx, spr, inv.x, inv.y, G.spritePx, THREAT);
  }

  // one label per row, centred over that row's survivors
  for (let r = 0; r < G.rows.length; r++){
    const live = G.invaders.filter(i => i.alive && i.row === r);
    if (!live.length) continue;

    const row = G.rows[r];
    const { lines, size } = row.label;
    const minX = Math.min(...live.map(i => i.x));
    const maxX = Math.max(...live.map(i => i.x + i.w));
    const cx   = (minX + maxX) / 2;
    const topY = Math.min(...live.map(i => i.y)) - row.labelH;

    // fade as the row is worn down — a quiet progress cue
    const total = G.invaders.filter(i => i.row === r).length;
    const alpha = 0.45 + 0.55 * (live.length / total);

    ctx.font = FONT(size);
    for (let i = 0; i < lines.length; i++){
      const w = ctx.measureText(lines[i]).width;
      ctx.fillStyle = `rgba(255,215,222,${alpha})`;
      ctx.fillText(lines[i], Math.round(cx - w / 2), Math.round(topY + i * row.lineH));
    }
  }
}

function drawBullets(){
  ctx.fillStyle = "#ffffff";
  ctx.shadowBlur = 12; ctx.shadowColor = ACCENT;
  for (const b of G.bullets) ctx.fillRect(b.x - 2, b.y - 12, 4, 14);
  ctx.shadowBlur = 0;
  ctx.fillStyle = THREAT;
  for (const b of G.bombs) ctx.fillRect(b.x - 2, b.y, 4, 12);
}

function drawPlayer(){
  const p = G.player;
  if (G.invuln > 0 && Math.floor(G.invuln * 12) % 2 === 0) return;
  const w = sprW(SPR_SHIP, p.px), h = sprH(SPR_SHIP, p.px);
  ctx.shadowBlur = 18; ctx.shadowColor = ACCENT;
  drawSprite(ctx, SPR_SHIP, p.x - w/2, p.y - h/2, p.px, ACCENT);
  ctx.shadowBlur = 0;
}

function drawParticles(){
  for (const p of G.parts){
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  const s = clamp(Math.round(VIEW.w / 90), 8, 12);
  ctx.font = FONT(s);
  ctx.fillStyle = "#63718c";
  ctx.fillText("SCORE", 14, 16);
  ctx.fillStyle = "#e8f1ff";
  ctx.fillText(String(G.score).padStart(5, "0"), 14, 16 + s * 1.8);

  const remaining = G.invaders.filter(i => i.alive).length;
  const rt = "RIVALS " + String(remaining).padStart(2, "0");
  const rw = ctx.measureText(rt).width;
  ctx.fillStyle = remaining <= 4 ? ACCENT : "#63718c";
  ctx.fillText(rt, (VIEW.w - rw) / 2, 16);

  const lp = 2, lw = sprW(SPR_SHIP, lp);
  for (let i = 0; i < G.lives; i++){
    drawSprite(ctx, SPR_SHIP, VIEW.w - 14 - (i + 1) * (lw + 8), 18, lp, ACCENT);
  }
}

function drawToasts(){
  const verb = up(STORY.verb || "DEFEATED");
  for (const t of G.toasts){
    const k = t.t / t.life;
    const alpha = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
    const size = clamp(Math.round(VIEW.w / 55), 11, 20);
    ctx.font = FONT(size);
    const w = ctx.measureText(t.text).width;
    const x = (VIEW.w - w) / 2, y = VIEW.h * 0.56 - k * 40;

    ctx.globalAlpha = alpha;
    if (t.plain){
      ctx.fillStyle = ACCENT;
      ctx.fillText(t.text, x, y);
    } else {
      ctx.fillStyle = "#8b93a8";
      ctx.fillText(t.text, x, y);
      ctx.fillStyle = THREAT;                     // strike-through
      ctx.fillRect(x - 4, y + size * 0.55, w + 8, 3);

      ctx.font = FONT(Math.round(size * 0.6));
      const sw = ctx.measureText(verb).width;
      ctx.fillStyle = ACCENT;
      ctx.fillText(verb, (VIEW.w - sw) / 2, y + size * 1.9);
    }
    ctx.globalAlpha = 1;
  }
}

/* --------------------------------------------------------------------------
   10. SCENES / DOM OVERLAYS
   -------------------------------------------------------------------------- */

const el = {
  attract:$("attract"), gameover:$("gameover"), credits:$("credits"),
  final:$("final"), roll:$("roll"), skip:$("skip"), hint:$("touchhint")
};
const show = (node, on) => { node.hidden = !on; };

function setScene(s){
  scene = s;
  show(el.attract,  s === SCENE.ATTRACT);
  show(el.gameover, s === SCENE.LOSE);
  show(el.credits,  s === SCENE.CREDITS);
  show(el.final,    s === SCENE.FINAL);
  show(el.hint,     s === SCENE.PLAY && TOUCH);

  // The escape hatch is available from the first frame to the last. Plenty of
  // recipients will never play a game in their inbox — they still have to be
  // able to reach the ending, and the CTA that lives there.
  const bail = s === SCENE.ATTRACT || s === SCENE.PLAY || s === SCENE.CREDITS;
  show(el.skip, bail);
  el.skip.textContent = s === SCENE.CREDITS ? "SKIP" : "SKIP TO THE ENDING";

  if (s === SCENE.WIN)     G.winTimer = 0;
  if (s === SCENE.CREDITS) startCredits();
}

function startGame(){
  resetGame();
  setScene(SCENE.PLAY);
}

function paintCopy(){
  $("a-kicker").textContent = `A ${up(VENDOR.name)} PRODUCTION`;
  $("a-sub").innerHTML =
    `${esc(up(PERSON.name))} vs. ${esc(up(STORY.threat || "THE RIVALS OF"))}<br>` +
    `<span class="em">${esc(up(COMPANY.name))}</span><br><br>` +
    `<span style="color:#6d7d99">${esc(up(STORY.mission || "CLEAR THEM ALL AND GET PROMOTED"))}</span>`;
  $("a-hint").textContent = TOUCH ? "TAP START — THEN DRAG TO MOVE" : "← → OR A/D TO MOVE — SPACE TO FIRE";

  $("go-sub").innerHTML =
    `THE COMPETITION WON THIS ROUND.<br>` +
    `<span style="color:#6d7d99">THEY USUALLY DO. THAT'S THE POINT.</span>`;

  $("f-kicker").textContent = "EFFECTIVE IMMEDIATELY";
  $("f-title").innerHTML =
    `${esc(PERSON.name)}<br><span class="em">${esc(PERSON.promotionTitle)}</span><br>` +
    `<span style="font-size:.5em;color:#9fb0cc">of ${esc(COMPANY.name)}</span>`;
  $("f-sub").textContent = up(VENDOR.tagline);

  const cta = $("f-cta");
  cta.href = VENDOR.ctaUrl || "#";
  cta.textContent = `SEE HOW ${up(VENDOR.name)} DOES IT →`;
}

let rollRAF = 0;
function startCredits(){
  el.roll.innerHTML = `
    <div class="cred"><span class="lbl">A ${esc(up(VENDOR.name))} PRODUCTION</span></div>
    <div class="cred">
      <span class="lbl">STARRING</span>
      <div class="val glow">${esc(PERSON.name)}</div>
      <div class="val" style="font-size:.62em;color:#9fb0cc">as THE FUTURE</div>
      <div class="val glow">${esc(PERSON.promotionTitle)}</div>
    </div>
    <div class="cred">
      <span class="lbl">AT</span>
      <div class="val">${esc(COMPANY.name)}</div>
    </div>
    <div class="cred">
      <span class="lbl">${esc(up(STORY.verb || "DEFEATED"))}</span>
      <ul>${ENEMIES.map(e => `<li>${esc(e.name)}</li>`).join("")}</ul>
    </div>
    <div class="cred">
      <span class="lbl">WITH</span>
      <div class="val" style="font-size:.72em">${esc(up(STORY.weapon || VENDOR.tagline))}</div>
    </div>
    <div class="cred">
      <span class="lbl">PRESENTED BY</span>
      <div class="val glow">${esc(VENDOR.name)}</div>
      <div class="val" style="font-size:.6em;color:#9fb0cc">${esc(VENDOR.tagline)}</div>
    </div>
    <div class="cred"><span class="lbl">THE END — ALMOST</span></div>
  `;

  const startY = window.innerHeight * 0.9;
  const dist   = startY + el.roll.scrollHeight;
  const dur    = REDUCED ? 3.5 : clamp(dist / 78, 8, 16);   // seconds
  const t0     = performance.now();

  cancelAnimationFrame(rollRAF);
  const step = now => {
    const k = clamp((now - t0) / 1000 / dur, 0, 1);
    el.roll.style.transform = `translateY(${startY - dist * k}px)`;
    if (scene !== SCENE.CREDITS) return;
    if (k < 1) rollRAF = requestAnimationFrame(step);
    else setScene(SCENE.FINAL);
  };
  el.roll.style.transform = `translateY(${startY}px)`;
  rollRAF = requestAnimationFrame(step);
}

$("a-start").onclick  = startGame;
$("go-retry").onclick = startGame;
$("go-skip").onclick  = () => setScene(SCENE.CREDITS);
$("skip").onclick     = () => setScene(scene === SCENE.CREDITS ? SCENE.FINAL : SCENE.CREDITS);
$("f-replay").onclick = startGame;

/* --------------------------------------------------------------------------
   11. MAIN LOOP
   -------------------------------------------------------------------------- */

let last = performance.now();
function frame(now){
  // Clamp dt so a backgrounded tab never teleports the formation into the player.
  const dt = clamp((now - last) / 1000, 0, 1/20);
  last = now;

  if (scene === SCENE.PLAY) updatePlay(dt);
  else if (scene === SCENE.WIN){
    updateParticles(dt);
    G.shake = Math.max(0, G.shake - dt * 22);
    G.winTimer += dt;
    if (G.winTimer > 1.1) setScene(SCENE.CREDITS);
  }

  render();
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------------------
   12. BOOT
   -------------------------------------------------------------------------- */

function boot(){
  // QA hook: ?debug exposes internals so a headless run can assert on state.
  if (location.search.includes("debug")){
    window.__gtm = { G, ENEMIES, T, VIEW, keys, startGame, updatePlay,
                     get scene(){ return scene; } };
  }
  layoutCanvas();
  resetGame();
  paintCopy();
  setScene(SCENE.ATTRACT);
  requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  layoutCanvas();
  // Re-fit labels for the new width, but never mid-run — that would move the
  // fight under the player's feet.
  if (scene !== SCENE.PLAY) resetGame();
});

// Labels are measured with the pixel font and invaders are built from logos,
// so wait for both — but never hang on either.
Promise.race([
  Promise.all([
    document.fonts && document.fonts.load ? document.fonts.load('12px "Press Start 2P"').then(() => document.fonts.ready) : null,
    loadEnemySprites()
  ]),
  new Promise(r => setTimeout(r, 3000))
]).then(boot, boot);

})();
</script>
